# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. See the documentation for more details.
org.gradle.parallel=true

# AndroidX package structure to make it unambiguous which package your dependency is
# using, and to enable granular version selection.
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class based on its actual package name,
# so resources can be used in all modules without transitive dependency issues
android.nonTransitiveRClass=true

# Kotlin compiler options
kotlin.compiler.execution.strategy=in-process

# BuildConfig
android.enableBuildConfigGenerationForLibraries=true

# Optimization
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
